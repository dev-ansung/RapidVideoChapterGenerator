[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapid-video-chapter-generator"
version = "0.1.0"
description = "High-speed keyframe-accelerated video scene boundary detector and lossless MP4/MKV chapter marker injector."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "dev-ansung", email = "dev.ansung@gmail.com" },
]
keywords = [
    "video",
    "chapters",
    "ffmpeg",
    "scene-detection",
    "mp4",
    "lossless",
    "keyframe",
    "youtube-chapters",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "rich>=13.7.0",
]

[project.scripts]
rapid-chapters = "rvcg.cli:main"
rvcg = "rvcg.cli:main"
rapid-video-chapter-generator = "rvcg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rvcg"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
