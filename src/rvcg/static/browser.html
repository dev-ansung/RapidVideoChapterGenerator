<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__VIDEO_TITLE__</title>
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.css" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0c10;
    --panel: #12141c;
    --border: #232736;
    --accent: #3b82f6;
    --text: #f3f4f6;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    font-size: 13px;
  }
  .hidden { display: none !important; }
  .layout {
    max-width: 1760px;
    margin: 0 auto;
    padding: 10px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .toolbar {
    position: sticky;
    top: 8px;
    z-index: 30;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    background: rgba(18, 20, 28, 0.94);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 12px;
  }
  .toolbar-left, .toolbar-right {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand {
    font-size: 13.5px;
    font-weight: 700;
  }
  .search-input {
    width: 220px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 9px;
    font-size: 12px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  button {
    background: #1b1f2e;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  button:hover {
    background: #252b3f;
    border-color: var(--accent);
  }
  .view-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .count-label {
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #282d3e;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.14s ease;
  }
  .card:hover,
  .card.active {
    border-color: var(--accent);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .card-header-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }
  .cut-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-block;
    cursor: help;
  }
  .cut-black {
    background: #9ca3af;
    border: 1px solid #6b7280;
  }
  .cut-visual {
    background: #f9fafb;
    border: 1px solid #d1d5db;
  }
  .cut-subdiv {
    background: #38bdf8;
    border: 1px solid #0284c7;
  }
  .cut-start,
  .cut-embedded {
    background: #10b981;
    border: 1px solid #059669;
  }
  .cut-manual {
    background: #f59e0b;
    border: 1px solid #d97706;
  }
  body.hide-cut-dots .cut-dot {
    display: none;
  }
  .card-badge {
    font-family: Menlo, monospace;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-title {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-meta {
    font-family: Menlo, monospace;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .contact-grid {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 1.5px;
    padding: 1.5px;
  }
  .grid-cell {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-color: #050608;
    background-repeat: no-repeat;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .grid-cell:hover {
    border-color: var(--accent);
  }
  .grid-cell video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }
  .cell-time {
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 2;
    padding: 1px 3px;
    font-family: Menlo, Monaco, monospace;
    font-size: 9px;
    font-weight: 600;
    color: #fff;
    background: rgba(0, 0, 0, 0.72);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    line-height: 1.2;
  }
  .gallery.list-view {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .gallery.list-view .card {
    flex-direction: row;
    align-items: stretch;
  }
  .gallery.list-view .card-header {
    width: 195px;
    flex-shrink: 0;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
    border-bottom: none;
    border-right: 1px solid var(--border);
    padding: 8px 10px;
  }
  .gallery.list-view .contact-grid {
    flex: 1;
    height: auto;
    aspect-ratio: 144 / 9;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: 1fr;
  }
  .player-shell {
    position: fixed;
    left: var(--win-x, 120px);
    top: var(--win-y, 80px);
    width: var(--win-w, min(720px, 90vw));
    z-index: 80;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 9px;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.88);
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  .popover-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 11px;
    background: #0e1017;
    border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .popover-header:active {
    cursor: grabbing;
  }
  .popover-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 11px;
    background: var(--accent);
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .popover-title {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .popover-range {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .player-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .video-js {
    width: 100% !important;
    height: 100% !important;
  }
  .vjs-sprite-tooltip {
    position: absolute;
    bottom: 18px;
    transform: translateX(-50%);
    width: 176px;
    height: 99px;
    border-radius: 5px;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    background-color: #000;
    background-repeat: no-repeat;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
    pointer-events: none;
    display: none;
    z-index: 20;
  }
  .vjs-progress-control:hover .vjs-sprite-tooltip {
    display: block;
  }
  .vjs-chapter-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(255, 255, 255, 0.55);
    pointer-events: none;
    z-index: 5;
  }
  #settings-popover {
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    color: var(--text);
    padding: 0;
    width: min(88vw, 420px);
    margin: auto;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85);
    overflow: hidden;
  }
  #settings-popover::backdrop {
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(4px);
  }
  .settings-modal-body {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pref-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .pref-toggle-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }
  .cut-legend {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .cut-legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  @media (max-width: 768px) {
    .gallery {
      grid-template-columns: 1fr;
    }
    .gallery.list-view .card {
      flex-direction: column;
    }
    .gallery.list-view .card-header {
      width: 100%;
      flex-direction: row;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .gallery.list-view .contact-grid {
      aspect-ratio: 16 / 9;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
  }
</style>
</head>
<body>
<div class="layout">
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand">__VIDEO_TITLE__</div>
      <span id="count-label" class="count-label"></span>
    </div>
    <div class="toolbar-right">
      <input id="search-input" class="search-input" type="search" placeholder="Search chapter or timestamp..." />
      <button type="button" class="view-btn active" data-view="grid">Grid</button>
      <button type="button" class="view-btn" data-view="list">List</button>
      <button type="button" class="open-settings-btn">⚙ Settings</button>
    </div>
  </header>

  <section id="gallery" class="gallery"></section>
</div>

<div id="player-shell" class="player-shell hidden">
  <div class="popover-header">
    <div class="popover-meta">
      <span id="now-badge" class="badge"></span>
      <span id="now-title" class="popover-title"></span>
      <span id="now-range" class="popover-range"></span>
    </div>
    <div class="toolbar-right">
      <button id="close-player-btn" type="button">✕</button>
    </div>
  </div>
  <div class="player-stage">
    <video id="vjs-player" class="video-js vjs-big-play-centered" controls playsinline preload="metadata"></video>
  </div>
</div>

<dialog id="settings-popover">
  <div class="popover-header">
    <span class="popover-title">Settings</span>
    <div class="toolbar-right">
      <button id="close-settings" type="button">✕</button>
    </div>
  </div>
  <div class="settings-modal-body">
    <label class="pref-toggle-row">
      <input id="pref-show-cut-dot" type="checkbox" checked />
      <span>Show cut origin indicator on scene cards</span>
    </label>
    <div class="cut-legend">
      <div class="cut-legend-row"><span class="cut-dot cut-black"></span><span>Gray — Black fade transition (Stage 1)</span></div>
      <div class="cut-legend-row"><span class="cut-dot cut-visual"></span><span>White — Visual scene transition (Stage 2)</span></div>
      <div class="cut-legend-row"><span class="cut-dot cut-subdiv"></span><span>Blue — Long-segment subdivision (Stage 3)</span></div>
      <div class="cut-legend-row"><span class="cut-dot cut-start"></span><span>Emerald — Video start or embedded chapter</span></div>
      <div class="cut-legend-row"><span class="cut-dot cut-manual"></span><span>Amber — Manual split</span></div>
    </div>
  </div>
</dialog>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy-bundle.umd.min.js"></script>
<script>
const VIDEO_SRC = __VIDEO_SRC__;
const SPRITE = __SPRITE__;
const CUTS = __CUTS__;
const SUBTITLES = __SUBTITLES__;

const playerShell = document.getElementById("player-shell");
const nowBadge = document.getElementById("now-badge");
const nowRange = document.getElementById("now-range");
const nowTitle = document.getElementById("now-title");
const gallery = document.getElementById("gallery");
const searchInput = document.getElementById("search-input");
const countLabel = document.getElementById("count-label");

const player = videojs("vjs-player", {
  controls: true,
  autoplay: false,
  preload: "metadata",
  fluid: false,
  playbackRates: [0.5, 1, 1.25, 1.5, 2],
  controlBar: {
    SkipButtons: { forward: 10, backward: 10 }
  }
});

let currentIndex = -1;
let searchQuery = "";
let sourceLoaded = false;

const winState = { x: null, y: null, w: 720 };

function applyPlayerBounds() {
  const maxW = Math.max(260, window.innerWidth - 20);
  if (winState.x === null || winState.y === null) {
    winState.w = Math.min(720, maxW);
    const initH = winState.w * (9 / 16) + 38;
    winState.x = Math.max(10, (window.innerWidth - winState.w) / 2);
    winState.y = Math.max(10, (window.innerHeight - initH) / 2);
  }
  winState.w = Math.max(260, Math.min(maxW, winState.w));
  const h = winState.w * (9 / 16) + 38;
  winState.x = Math.max(6, Math.min(window.innerWidth - winState.w - 6, winState.x));
  winState.y = Math.max(6, Math.min(window.innerHeight - h - 6, winState.y));
  playerShell.style.setProperty("--win-x", `${Math.round(winState.x)}px`);
  playerShell.style.setProperty("--win-y", `${Math.round(winState.y)}px`);
  playerShell.style.setProperty("--win-w", `${Math.round(winState.w)}px`);
}

function isInPip() {
  const v = (player.el && player.el().querySelector("video")) || document.querySelector("#vjs-player video");
  return Boolean(
    document.pictureInPictureElement ||
    (typeof player.isInPictureInPicture === "function" && player.isInPictureInPicture()) ||
    (v && v.webkitPresentationMode === "picture-in-picture")
  );
}

function showPlayer(visible) {
  if (!visible) {
    if (!isInPip()) player.pause();
    playerShell.classList.add("hidden");
    return;
  }
  playerShell.classList.remove("hidden");
  applyPlayerBounds();
}

function fmtHms(sec) {
  const s = Math.max(0, Math.floor(sec));
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  return (
    String(hh).padStart(2, "0") + ":" +
    String(mm).padStart(2, "0") + ":" +
    String(ss).padStart(2, "0")
  );
}

function fmtHmsMs(sec) {
  const s = Math.max(0, sec);
  const ms = Math.floor((s - Math.floor(s)) * 1000);
  return fmtHms(s) + "." + String(ms).padStart(3, "0");
}

function setCellSpriteFrame(el, timeSec) {
  const frameIdx = Math.max(0, Math.min(SPRITE.total_frames - 1, Math.floor(timeSec / SPRITE.interval)));
  const col = frameIdx % SPRITE.cols;
  const row = Math.floor(frameIdx / SPRITE.cols);
  const xPct = SPRITE.cols > 1 ? (col / (SPRITE.cols - 1)) * 100 : 0;
  const yPct = SPRITE.rows > 1 ? (row / (SPRITE.rows - 1)) * 100 : 0;
  el.style.backgroundImage = `url("${SPRITE.url}")`;
  el.style.backgroundSize = `${SPRITE.cols * 100}% ${SPRITE.rows * 100}%`;
  el.style.backgroundPosition = `${xPct.toFixed(3)}% ${yPct.toFixed(3)}%`;
}

player.ready(() => {
  const progressControl = player.controlBar.progressControl;
  const seekBar = progressControl.seekBar;

  const spriteTip = document.createElement("div");
  spriteTip.className = "vjs-sprite-tooltip";
  seekBar.el().appendChild(spriteTip);

  player.one("loadedmetadata", () => {
    const totalDur = player.duration();
    if (totalDur > 0) {
      CUTS.slice(1).forEach((seg) => {
        const marker = document.createElement("div");
        marker.className = "vjs-chapter-marker";
        marker.style.left = `${(seg.start_time / totalDur) * 100}%`;
        seekBar.el().appendChild(marker);
      });
    }
  });

  progressControl.el().addEventListener("mousemove", (e) => {
    const rect = seekBar.el().getBoundingClientRect();
    if (!rect.width) return;

    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const duration = player.duration() || CUTS[CUTS.length - 1].end_time;
    const hoverTime = ratio * duration;

    setCellSpriteFrame(spriteTip, hoverTime);

    const halfW = 88;
    const rawX = ratio * rect.width;
    const clampedX = Math.max(halfW, Math.min(rect.width - halfW, rawX));
    spriteTip.style.left = `${clampedX}px`;
  });
});

player.on("timeupdate", () => {
  const t = player.currentTime();
  const idx = CUTS.findIndex((c) => t >= c.start_time && t < c.end_time);
  if (idx !== -1 && idx !== currentIndex) {
    currentIndex = idx;
    const item = CUTS[idx];
    nowBadge.textContent = "#" + item.id;
    nowTitle.textContent = item.title;
    nowRange.textContent = item.source_range + " (" + item.duration_str + ")";
    highlightActiveCard();
  }
});

function openAt(index, seekTime) {
  if (index < 0 || index >= CUTS.length) return;
  const item = CUTS[index];
  currentIndex = index;

  nowBadge.textContent = "#" + item.id;
  nowTitle.textContent = item.title;
  nowRange.textContent = item.source_range + " (" + item.duration_str + ")";
  highlightActiveCard();

  if (!isInPip()) {
    showPlayer(true);
  }

  if (sourceLoaded) {
    player.currentTime(seekTime);
    player.play().catch(() => {});
  } else {
    sourceLoaded = true;
    player.src({ type: "video/mp4", src: VIDEO_SRC });
    player.one("loadedmetadata", () => {
      SUBTITLES.forEach((sub) => {
        const blob = new Blob([sub.vtt], { type: "text/vtt;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const trackEl = player.addRemoteTextTrack(
          {
            kind: "subtitles",
            label: sub.label,
            srclang: sub.srclang,
            src: url,
            default: sub.default,
          },
          false
        );
        if (sub.default && trackEl && trackEl.track) {
          trackEl.track.mode = "showing";
        }
      });
      player.currentTime(seekTime);
      player.play().catch(() => {});
    });
  }
}

document.getElementById("close-player-btn").addEventListener("click", () => {
  showPlayer(false);
});

window.addEventListener("resize", () => {
  if (!playerShell.classList.contains("hidden")) {
    applyPlayerBounds();
  }
});

if (typeof interact !== "undefined") {
  interact(playerShell)
    .draggable({
      ignoreFrom: "button, .vjs-control-bar, input",
      listeners: {
        move(event) {
          winState.x += event.dx;
          winState.y += event.dy;
          applyPlayerBounds();
        },
      },
    })
    .resizable({
      edges: { left: true, right: true, bottom: true, top: true },
      margin: 12,
      ignoreFrom: "button, .vjs-control-bar",
      listeners: {
        move(event) {
          let newW = event.rect.width;
          if ((event.edges.top || event.edges.bottom) && !event.edges.left && !event.edges.right) {
            newW = (event.rect.height - 38) * (16 / 9);
          }
          newW = Math.max(260, Math.min(window.innerWidth - 20, newW));
          const prevW = winState.w;
          const prevH = prevW * (9 / 16) + 38;
          const newH = newW * (9 / 16) + 38;
          if (event.edges.left) {
            winState.x += prevW - newW;
          }
          if (event.edges.top) {
            winState.y += prevH - newH;
          }
          winState.w = newW;
          applyPlayerBounds();
        },
      },
    });
}

document.addEventListener("keydown", (e) => {
  if (playerShell.classList.contains("hidden") && !isInPip()) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Escape") {
    e.preventDefault();
    showPlayer(false);
    return;
  }
  const step = e.shiftKey ? 10 : 5;
  if (e.key === "ArrowRight") {
    e.preventDefault();
    player.currentTime(Math.min(player.duration() || Infinity, player.currentTime() + step));
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    player.currentTime(Math.max(0, player.currentTime() - step));
  } else if (e.key === " " || e.key === "k") {
    e.preventDefault();
    if (player.paused()) player.play().catch(() => {});
    else player.pause();
  } else if (e.key === "f") {
    e.preventDefault();
    if (player.isFullscreen()) player.exitFullscreen();
    else player.requestFullscreen();
  }
});

function highlightActiveCard() {
  document.querySelectorAll(".card").forEach((el) => {
    el.classList.toggle("active", Number(el.dataset.index) === currentIndex);
  });
}

function matchesFilter(item) {
  if (!searchQuery) return true;
  const q = searchQuery.normalize("NFC").toLowerCase();
  return (
    item.id.toLowerCase().includes(q) ||
    item.title.normalize("NFC").toLowerCase().includes(q) ||
    item.source_range.toLowerCase().includes(q)
  );
}

function renderGallery() {
  gallery.innerHTML = "";
  let visibleCount = 0;

  CUTS.forEach((item, index) => {
    if (!matchesFilter(item)) return;
    visibleCount++;

    const card = document.createElement("article");
    card.className = "card" + (index === currentIndex ? " active" : "");
    card.dataset.index = index;

    const header = document.createElement("div");
    header.className = "card-header";
    header.addEventListener("click", () => openAt(index, item.start_time));

    const hLeft = document.createElement("div");
    hLeft.className = "card-header-left";

    const cutDot = document.createElement("span");
    cutDot.className = "cut-dot cut-" + (item.cut_kind || "start");
    cutDot.dataset.tippyContent = item.cut_detail || "";

    const badge = document.createElement("span");
    badge.className = "card-badge";
    badge.textContent = `#${item.id} · ${item.title}`;

    hLeft.appendChild(cutDot);
    hLeft.appendChild(badge);

    const metaSpan = document.createElement("span");
    metaSpan.className = "card-meta";
    metaSpan.textContent = `${item.source_range} · ${item.duration_str}`;

    header.appendChild(hLeft);
    header.appendChild(metaSpan);

    const grid = document.createElement("div");
    grid.className = "contact-grid";

    const slots = item.cell_times.length >= 9 ? item.cell_times.slice(0, 9) : item.cell_times;
    slots.forEach((baseTime) => {
      const cell = document.createElement("div");
      cell.className = "grid-cell";
      setCellSpriteFrame(cell, baseTime);

      const timeBadge = document.createElement("span");
      timeBadge.className = "cell-time";
      timeBadge.textContent = fmtHms(baseTime);
      cell.appendChild(timeBadge);

      let cellVideo = null;
      let rafId = null;

      cell.addEventListener("mouseenter", () => {
        if (cellVideo) return;
        cellVideo = document.createElement("video");
        cellVideo.src = VIDEO_SRC;
        cellVideo.muted = true;
        cellVideo.playsInline = true;
        cellVideo.preload = "auto";
        cellVideo.addEventListener("loadedmetadata", () => {
          if (!cellVideo) return;
          cellVideo.currentTime = baseTime;
          cellVideo.play().catch(() => {});
        });
        const tick = () => {
          if (!cellVideo) return;
          const ct = cellVideo.currentTime;
          if (ct >= baseTime + item.card_dur) {
            cellVideo.currentTime = baseTime;
          }
          timeBadge.textContent = fmtHmsMs(ct || baseTime);
          rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
        cell.insertBefore(cellVideo, timeBadge);
      });

      cell.addEventListener("mouseleave", () => {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        if (cellVideo) {
          cellVideo.pause();
          cellVideo.removeAttribute("src");
          cellVideo.load();
          cellVideo.remove();
          cellVideo = null;
        }
        timeBadge.textContent = fmtHms(baseTime);
      });

      cell.addEventListener("click", (e) => {
        e.stopPropagation();
        openAt(index, baseTime);
      });

      grid.appendChild(cell);
    });

    card.appendChild(header);
    card.appendChild(grid);
    gallery.appendChild(card);
  });

  if (typeof tippy !== "undefined") {
    tippy(gallery.querySelectorAll(".cut-dot"), {
      placement: "top",
      delay: [40, 0],
      maxWidth: 360,
      appendTo: () => document.body,
    });
  }

  countLabel.textContent = `${visibleCount} / ${CUTS.length} chapters`;
}

const settingsPopover = document.getElementById("settings-popover");
const prefShowCutDot = document.getElementById("pref-show-cut-dot");

function syncCutDotPreference() {
  document.body.classList.toggle("hide-cut-dots", !prefShowCutDot.checked);
  try {
    localStorage.setItem("rvcg_show_cut_dot", prefShowCutDot.checked ? "true" : "false");
  } catch (_) {}
}

try {
  prefShowCutDot.checked = localStorage.getItem("rvcg_show_cut_dot") !== "false";
} catch (_) {}
syncCutDotPreference();

prefShowCutDot.addEventListener("change", syncCutDotPreference);
document.querySelectorAll(".open-settings-btn").forEach((btn) => {
  btn.addEventListener("click", () => settingsPopover.showModal());
});
document.getElementById("close-settings").addEventListener("click", () => settingsPopover.close());

searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value.trim();
  renderGallery();
});

document.querySelectorAll(".view-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".view-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    gallery.classList.toggle("list-view", btn.dataset.view === "list");
  });
});

renderGallery();
</script>
</body>
</html>
